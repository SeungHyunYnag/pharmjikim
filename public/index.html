<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>휴일 지킴이 약국</title>

    <!-- 네이버 지도 API -->
    <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=c4or0vlqhm"></script>

    <style>
        #map {
            width: 100%;
            height: 100vh;
        }

        .info-box {
            padding: 10px;
            background: white;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 13px;
        }

        .info-box a {
            color: blue;
            text-decoration: underline;
        }

        .notice {
            font-size: 12px;
            font-weight: bold;
            margin-top: 6px;
            margin-bottom: 6px;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script>

let map;

// 시간 포맷 함수 (0900 → 09:00)
function formatTime(t) {
    if (!t) return "정보 없음";
    t = t.toString().padStart(4, "0");
    return t.substring(0, 2) + ":" + t.substring(2);
}

// 지도 초기화
function initMap(lat, lng) {

    map = new naver.maps.Map("map", {
        center: new naver.maps.LatLng(lat, lng),
        zoom: 14
    });

    // 🔴 내 위치 마커
    new naver.maps.Marker({
        position: new naver.maps.LatLng(lat, lng),
        map: map,
        icon: {
            url: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22">
                    <circle cx="11" cy="11" r="7" fill="#FF0000" stroke="white" stroke-width="2"/>
                </svg>
            `),
            size: new naver.maps.Size(22, 22),
            anchor: new naver.maps.Point(11, 11)
        }
    });

    loadPharmacies(lat, lng);
}

// 약국 데이터 불러오기
async function loadPharmacies(lat, lng) {

    const res = await fetch(`/api/pharmacies?lat=${lat}&lng=${lng}`);
    const data = await res.json();

    if (!data || data.length === 0) {
        alert("주변 약국 없음");
        return;
    }

    data.forEach(p => {

        const marker = new naver.maps.Marker({
            position: new naver.maps.LatLng(p.lat, p.lng),
            map: map
        });

        // ✅ InfoWindow (크기 제한 추가)
        const infoWindow = new naver.maps.InfoWindow({
            maxWidth: 250,   // 🔥 여기 추가된 핵심
            content: `
                <div class="info-box">
                    <b>${p.name}</b><br/><br/>

                    📞 <a href="tel:${p.tel}">${p.tel}</a><br/>
                    🕒 ${formatTime(p.start)} ~ ${formatTime(p.end)}<br/>
                    📍 ${p.addr || ""}<br/>

                    <div class="notice">
                        ※ 보다 정확한 운영 여부는 전화로 확인 바랍니다
                    </div>

                    <hr/>

                    🔗 <a href="https://www.pharm114.or.kr" target="_blank">휴일지킴이 약국</a><br/>
                    🔗 <a href="https://m.place.naver.com" target="_blank">네이버 지도 영업정보</a>
                </div>
            `
        });

        naver.maps.Event.addListener(marker, "click", function () {
            infoWindow.open(map, marker);
        });
    });
}

// 현재 위치 가져오기
navigator.geolocation.getCurrentPosition(
    function (pos) {

        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        initMap(lat, lng);
    },
    function (err) {
        alert("위치 권한을 허용해야 합니다.");
    },
    {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
    }
);

</script>

</body>
</html>
