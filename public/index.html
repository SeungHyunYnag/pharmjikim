<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>휴일 지킴이 약국</title>

<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=c4or0vlqhm"></script>

<style>
body,html{margin:0;padding:0;}
#map{width:100%;height:100vh;}

.info-box{
    padding:12px;
    background:#fff;
    border-radius:10px;
    font-size:13px;
    line-height:1.5;
    max-width:260px;
}

a{text-decoration:none;}
</style>
</head>

<body>

<div id="map"></div>

<script>

let map;
let currentInfoWindow = null;

function closeInfo(){
    if(currentInfoWindow){
        currentInfoWindow.close();
        currentInfoWindow = null;
    }
}

function formatTime(t){
    if(!t) return "-";
    t = t.toString().padStart(4,"0");
    return t.slice(0,2)+":"+t.slice(2);
}

function initMap(lat,lng){

    map = new naver.maps.Map("map",{
        center:new naver.maps.LatLng(lat,lng),
        zoom:14
    });

    new naver.maps.Marker({
        position:new naver.maps.LatLng(lat,lng),
        map:map,
        icon:{
            content:`<div style="width:14px;height:14px;background:red;border-radius:50%;border:2px solid #fff"></div>`
        }
    });

    load(lat,lng);
}

async function load(lat,lng){

    const res = await fetch(`/api/pharmacies?lat=${lat}&lng=${lng}`);
    const data = await res.json();

    if(!data || data.length === 0){
        if(confirm("근처 약국이 없습니다.\n공공심야약국으로 이동할까요?")){
            location.href =
            "https://news.seoul.go.kr/welfare/archives/567003";
        }
        return;
    }

    data.forEach(p => {

        const marker = new naver.maps.Marker({
            position:new naver.maps.LatLng(p.lat,p.lng),
            map:map
        });

        const naverLink =
        `https://map.naver.com/v5/search/${encodeURIComponent(p.name+" "+p.addr)}`;

        const info = new naver.maps.InfoWindow({
            content:`
                <div class="info-box">

                    <b>${p.name}</b><br/>

                    📍 ${p.addr}<br/><br/>

                    <div style="display:flex;justify-content:space-between;">
                        <span>🕒 ${formatTime(p.weekdayStart)} ~ ${formatTime(p.weekdayEnd)}</span>
                        <span>${p.isOpen ? "🟢 운영중" : "🔴 종료"}</span>
                    </div>

                    <br/>

                    📞 <a href="tel:${p.tel}">${p.tel || "-"}</a>

                    <hr/>

                    <a href="https://www.pharm114.or.kr" target="_blank">
                        🔗 휴일지킴이 약국
                    </a><br/>

                    <a href="${naverLink}" target="_blank">
                        🔎 네이버 지도
                    </a>

                </div>
            `
        });

        naver.maps.Event.addListener(marker,"click",()=>{
            closeInfo();
            info.open(map,marker);
            currentInfoWindow = info;
        });

    });
}

navigator.geolocation.getCurrentPosition(pos=>{
    initMap(pos.coords.latitude,pos.coords.longitude);
});

</script>

</body>
</html>
