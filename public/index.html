<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>휴일 지킴이 약국</title>

<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=c4or0vlqhm"></script>

<style>
body,html{
    margin:0;
    padding:0;
}

#map{
    width:100%;
    height:100vh;
}

.info-box{
    padding:12px;
    background:#fff;
    border-radius:10px;
    font-size:13px;
    line-height:1.5;
    max-width:270px;
}

a{
    text-decoration:none;
}
</style>
</head>

<body>

<div id="map"></div>

<script>

let map;
let currentInfoWindow = null;

// =========================
function closeInfo(){
    if(currentInfoWindow){
        currentInfoWindow.close();
        currentInfoWindow = null;
    }
}

// =========================
function trimAddress(addr){
    if(!addr) return "";
    return addr.split(" ").slice(0,3).join(" ");
}

// =========================
function initMap(lat,lng){

    map = new naver.maps.Map("map",{
        center:new naver.maps.LatLng(lat,lng),
        zoom:14
    });

    // 🔴 현재 위치 (유지)
    new naver.maps.Marker({
        position:new naver.maps.LatLng(lat,lng),
        map:map,
        icon:{
            content:`
                <div style="
                    width:14px;
                    height:14px;
                    background:red;
                    border-radius:50%;
                    border:2px solid #fff;
                "></div>
            `
        }
    });

    // 지도 클릭 → 닫기
    naver.maps.Event.addListener(map,"click",()=>{
        closeInfo();
    });

    load(lat,lng);
}

// =========================
async function load(lat,lng){

    const res = await fetch(`/api/pharmacies?lat=${lat}&lng=${lng}`);
    const data = await res.json();

    data.forEach(p=>{

        const marker = new naver.maps.Marker({
            position:new naver.maps.LatLng(p.lat,p.lng),
            map:map
        });

        const cleanAddr = trimAddress(p.addr);

        const naverLink =
        `https://map.naver.com/v5/search/${encodeURIComponent(p.name + " " + cleanAddr)}`;

        const info = new naver.maps.InfoWindow({
            content:`
                <div class="info-box">

                    <!-- 1. 약국 이름 -->
                    <b>${p.name}</b><br/><br/>

                    <!-- 2. 주소 -->
                    📍 ${p.addr}<br/><br/>

                    <!-- 3. 운영시간 + 거리 -->
                    🕒 ${p.weekdayStart || "-"} ~ ${p.weekdayEnd || "-"}
                    &nbsp;/&nbsp;
                    📏 ${p.distance.toFixed(2)} km<br/><br/>

                    <!-- 4. 전화번호 -->
                    📞 <a href="tel:${p.tel}">
                        ${p.tel || "-"}
                    </a><br/><br/>

                    <!-- 5. 안내 문구 -->
                    <div style="border-top:1px solid #ddd;margin:10px 0;"></div>

                    ※ 보다 정확한 운영 여부는 전화로 확인 바랍니다<br/><br/>

                    <!-- 6. pharm114 -->
                    🔗 <a href="https://www.pharm114.or.kr" target="_blank">
                        휴일지킴이 약국 (pharm114)
                    </a><br/><br/>

                    <!-- 7. 네이버 -->
                    🔎 <a href="${naverLink}" target="_blank">
                        네이버 정보
                    </a>

                </div>
            `
        });

        naver.maps.Event.addListener(marker,"click",()=>{
            closeInfo();
            info.open(map,marker);
            currentInfoWindow = info;
        });

    });
}

// =========================
navigator.geolocation.getCurrentPosition(pos=>{
    initMap(pos.coords.latitude,pos.coords.longitude);
});

</script>

</body>
</html>
