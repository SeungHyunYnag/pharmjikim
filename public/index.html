<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>휴일 지킴이 약국</title>

<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=c4or0vlqhm"></script>

<style>
#map { width:100%; height:100vh; }

.info-box{
    padding:12px;
    background:#fff;
    border-radius:10px;
    font-size:13px;
    line-height:1.5;
}

.notice-box{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:#fff;
    padding:15px;
    border-radius:10px;
    display:none;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="noticeBox" class="notice-box">
    운영중 약국이 없습니다
</div>

<script>

let map;
let currentInfoWindow = null;

/* ------------------------------------
   🔥 InfoWindow 안전 닫기
------------------------------------ */
function closeInfoWindow(){
    if(currentInfoWindow){
        currentInfoWindow.close();
        currentInfoWindow = null;
    }
}

/* ------------------------------------
   📍 지도
------------------------------------ */
function initMap(lat,lng){

    map = new naver.maps.Map("map",{
        center:new naver.maps.LatLng(lat,lng),
        zoom:14
    });

    // 내 위치 (빨간색)
    new naver.maps.Marker({
        position:new naver.maps.LatLng(lat,lng),
        map:map,
        icon:{
            content:`<div style="width:12px;height:12px;background:red;border-radius:50%;border:2px solid #fff"></div>`
        }
    });

    loadPharmacies(lat,lng);
}

/* ------------------------------------
   📦 데이터
------------------------------------ */
async function loadPharmacies(lat,lng){

    const res = await fetch(`/api/pharmacies?lat=${lat}&lng=${lng}`);
    const data = await res.json();

    let hasOpen = false;

    data.forEach(p => {

        const marker = new naver.maps.Marker({
            position:new naver.maps.LatLng(p.lat,p.lng),
            map:map
        });

        if(p.isOpen) hasOpen = true;

        const link =
        `https://map.naver.com/v5/search/${encodeURIComponent(p.name + " " + (p.addr || ""))}`;

        const info = new naver.maps.InfoWindow({
            content:`
                <div class="info-box">
                    <b>${p.name}</b><br/>
                    📞 ${p.tel || "-"}<br/>
                    📍 ${p.addr || ""}<br/>
                    🕒 ${p.isOpen ? "🟢 운영중" : "🔴 종료"}<br/><br/>
                    <a href="${link}" target="_blank">네이버 정보</a>
                </div>
            `
        });

        naver.maps.Event.addListener(marker,"click",()=>{

            closeInfoWindow(); // 🔥 핵심

            info.open(map,marker);
            currentInfoWindow = info;
        });
    });

    if(!hasOpen){
        document.getElementById("noticeBox").style.display="block";
    }
}

/* ------------------------------------
   📍 위치
------------------------------------ */
navigator.geolocation.getCurrentPosition(pos=>{
    initMap(pos.coords.latitude,pos.coords.longitude);
});

</script>

</body>
</html>
