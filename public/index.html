<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>휴일 지킴이 약국</title>

<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=c4or0vlqhm"></script>

<style>
#map{width:100%;height:100vh;}

.info-box{
    padding:12px;
    background:#fff;
    border-radius:10px;
    font-size:13px;
    line-height:1.5;
}
</style>
</head>

<body>

<div id="map"></div>

<script>

let map;
let currentInfoWindow = null;

function closeInfo(){
    if(currentInfoWindow){
        currentInfoWindow.close();
        currentInfoWindow = null;
    }
}

function initMap(lat,lng){

    map = new naver.maps.Map("map",{
        center:new naver.maps.LatLng(lat,lng),
        zoom:14
    });

    new naver.maps.Marker({
        position:new naver.maps.LatLng(lat,lng),
        map:map,
        icon:{
            content:`<div style="width:12px;height:12px;background:red;border-radius:50%;border:2px solid #fff"></div>`
        }
    });

    load(lat,lng);
}

/* -----------------------------
   데이터
----------------------------- */
async function load(lat,lng){

    const res = await fetch(`/api/pharmacies?lat=${lat}&lng=${lng}`);
    const data = await res.json();

    data.forEach(p => {

        const marker = new naver.maps.Marker({
            position:new naver.maps.LatLng(p.lat,p.lng),
            map:map
        });

        const shortAddr =
        (p.addr || "").split(" ").slice(0,3).join(" ");

        const naverLink =
        `https://map.naver.com/v5/search/${encodeURIComponent(p.name + " " + shortAddr)}`;

        const info = new naver.maps.InfoWindow({
            content:`
                <div class="info-box">

                    <b>${p.name}</b><br/><br/>

                    <!-- 🔥 한 줄 (요구사항) -->
                    <div style="
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                        margin-bottom:6px;
                    ">
                        <span>
                            🕒 ${p.weekdayStart || "-"} ~ ${p.weekdayEnd || "-"}
                        </span>

                        <span>
                            🟢 ${p.isOpen ? "운영중" : "종료"}
                        </span>
                    </div>

                    📞 <a href="tel:${p.tel}">${p.tel || "-"}</a><br/>
                    📍 ${p.addr || ""}<br/>

                    <div style="font-size:11px;color:#666;margin-top:6px;">
                        ※ 보다 정확한 운영 여부는 전화로 확인 바랍니다
                    </div>

                    <hr/>

                    <div>
                        <a href="https://www.pharm114.or.kr" target="_blank">
                            🔗 휴일지킴이 약국 (pharm114)
                        </a>
                    </div>

                    <div>
                        <a href="${naverLink}" target="_blank">
                            🔎 네이버 정보
                        </a>
                    </div>

                </div>
            `
        });

        naver.maps.Event.addListener(marker,"click",()=>{
            closeInfo();
            info.open(map,marker);
            currentInfoWindow = info;
        });
    });
}

navigator.geolocation.getCurrentPosition(pos=>{
    initMap(pos.coords.latitude,pos.coords.longitude);
});

</script>

</body>
</html>
