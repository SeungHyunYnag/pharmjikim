<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>휴일 지킴이 약국</title>

    <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=c4or0vlqhm"></script>

    <style>
        #map {
            width: 100%;
            height: 100vh;
        }

        .info-box {
            padding: 10px;
            background: white;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 13px;
        }

        .info-box a {
            color: blue;
            text-decoration: underline;
        }

        .no-box {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            width: 300px;
            z-index: 9999;
        }

        .btn {
            margin-top: 10px;
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-primary {
            background: #2f80ed;
            color: white;
        }

        .btn-gray {
            background: #eee;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script>

let map;
let markers = [];

/* =========================
   거리 계산
========================= */
function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1*Math.PI/180) *
        Math.cos(lat2*Math.PI/180) *
        Math.sin(dLon/2) * Math.sin(dLon/2);

    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

/* =========================
   지도 초기화
========================= */
function initMap(lat, lng) {

    map = new naver.maps.Map("map", {
        center: new naver.maps.LatLng(lat, lng),
        zoom: 14
    });

    // 🔴 내 위치
    new naver.maps.Marker({
        position: new naver.maps.LatLng(lat, lng),
        map: map,
        icon: {
            url: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22">
                    <circle cx="11" cy="11" r="7" fill="red" stroke="white" stroke-width="2"/>
                </svg>
            `),
            size: new naver.maps.Size(22,22),
            anchor: new naver.maps.Point(11,11)
        }
    });

    loadPharmacies(lat, lng);
}

/* =========================
   약국 로드
========================= */
async function loadPharmacies(lat, lng) {

    const res = await fetch(`http://localhost:3000/api/pharmacies?lat=${lat}&lng=${lng}`);
    const data = await res.json();

    if (!data || data.length === 0) return;

    // 기존 마커 제거
    markers.forEach(m => m.setMap(null));
    markers = [];

    let nearCount = 0;

    data.forEach(p => {

        if (!p.lat || !p.lng) return;

        const distance = getDistance(lat, lng, p.lat, p.lng);

        if (distance <= 1) {
            nearCount++;
        }

        const marker = new naver.maps.Marker({
            position: new naver.maps.LatLng(p.lat, p.lng),
            map: map
        });

        markers.push(marker);

        const info = new naver.maps.InfoWindow({
            content: `
                <div class="info-box">
                    <b>${p.name}</b><br/><br/>

                    📞 <a href="tel:${p.tel}">${p.tel}</a><br/>
                    🕒 ${formatTime(p.start)} ~ ${formatTime(p.end)}<br/>
                    📍 ${p.addr || ""}<br/>

                    <div style="
                        margin: 2px 0 3px 0;
                        font-size: 12px;
                        font-weight: bold;
                        color: #000;
                    ">
                        ※ 보다 정확한 운영 여부는 전화로 확인 바랍니다.
                    </div>

                    <hr/>

                    🔗 <a href="https://map.naver.com/v5/search/${encodeURIComponent(p.name)}" target="_blank">
                        네이버 지도 영업정보
                    </a><br/>

                    🔗 <a href="https://www.pharm114.or.kr" target="_blank">
                        휴일지킴이 약국
                    </a>
                </div>
            `
        });

        naver.maps.Event.addListener(marker, "click", () => {
            info.open(map, marker);
        });
    });

    // 🔥 2km 내 약국 없을 때
    if (nearCount === 0) {
        showNoPharmacyUI();
    }
}

/* =========================
   없음 팝업
========================= */
function showNoPharmacyUI() {

    const box = document.createElement("div");
    box.className = "no-box";

    box.innerHTML = `
        <div style="font-weight:700; font-size:16px;">
            주변 약국 없음
        </div>

        <div style="margin-top:10px; font-size:13px; color:#555;">
            반경 1km 안에 운영중인 약국이 없습니다.<br/>
            서울시 공공심야약국 정보를 확인하시겠습니까?
        </div>

        <button class="btn btn-primary" id="go">
            확인
        </button>

        <button class="btn btn-gray" id="close">
            닫기
        </button>
    `;

    document.body.appendChild(box);

    document.getElementById("go").onclick = function () {
        window.open(
            "https://news.seoul.go.kr/welfare/archives/567003?tr_code=short",
            "_blank"
        );
        box.remove();
    };

    document.getElementById("close").onclick = () => box.remove();
}

/* =========================
   시간 포맷
========================= */
function formatTime(t) {
    if (!t) return "정보 없음";
    let s = t.toString().replace(":", "").padStart(4, "0");
    return s.slice(0,2) + ":" + s.slice(2);
}

/* =========================
   위치
========================= */
navigator.geolocation.getCurrentPosition(
    (pos) => initMap(pos.coords.latitude, pos.coords.longitude),
    () => alert("위치 권한 필요")
);

</script>

</body>
</html>
